name: Deploy Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: storefront-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Refresh PR preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync PR preview slot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/ "s3://ajeets-robots-preview-pr-${{ github.event.pull_request.number }}/" --delete
