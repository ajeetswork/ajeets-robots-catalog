name: Deploy Storefront Staging

on:
  push:
    branches:
      - develop
    paths:
      - "src/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging storefront
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload staging storefront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/ s3://ajeets-robots-storefront-staging/ --delete
