name: Publish Catalog Package

on:
  push:
    tags:
      - "catalog-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish shared catalog package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish stable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag stable
